# Perfil de pruebas: base H2 en memoria en modo PostgreSQL.
# La suite no necesita un PostgreSQL corriendo; el esquema lo genera Hibernate
# desde las propias entidades (create-drop), asi que estos tests tambien
# verifican que el mapeo JPA es coherente.
spring.datasource.url=jdbc:h2:mem:denguesim;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
