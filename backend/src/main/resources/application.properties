spring.application.name=denguesim
server.port=8080

# --- PostgreSQL ---
# Las credenciales se pueden sobrescribir con las variables de entorno
# DB_URL, DB_USER y DB_PASSWORD sin tocar este archivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/denguesim}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:sysdevjdz26}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema_postgresql.sql
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
